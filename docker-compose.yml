version: '3.8'

services:
  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017/synctalk
      - JWT_ACCESS_SECRET=dev_access_secret_123
      - JWT_REFRESH_SECRET=dev_refresh_secret_123
      - PORT=5000
      - CLIENT_URL=http://localhost:80
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - mongo
    volumes:
      - ./server/uploads:/app/uploads

  client:
    build: ./client
    ports:
      - "80:80"
    depends_on:
      - server

  mongo:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
